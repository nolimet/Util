name: Sign and publish

# For every pushed version tag: pack the package with Unity's UPM CLI, signed for the Unity organization, attach the
# signed tarball to a GitHub Release with the same tag, then ask OpenUPM to publish it and wait until it is installable.
# OpenUPM tracks this package with trackingMode: githubRelease, so it publishes the release asset unchanged.
#
# Needs the repository secrets UPM_SERVICE_ACCOUNT_KEY_ID, UPM_SERVICE_ACCOUNT_KEY_SECRET (a Unity service account with
# package signing permission) and UPM_ORG_ID (the Unity organization id).
#
# Running it by hand (Actions > Sign and publish > Run workflow) is a dry run: it packs, signs and verifies the package
# and uploads the tarball as a workflow artifact, without creating a release or contacting OpenUPM.
on:
  push:
    tags:
      - '*.*.*'
  workflow_dispatch:

permissions:
  contents: write # create the GitHub Release
  id-token: write # OIDC token for the OpenUPM trigger

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      UPM_SERVICE_ACCOUNT_KEY_ID: ${{ secrets.UPM_SERVICE_ACCOUNT_KEY_ID }}
      UPM_SERVICE_ACCOUNT_KEY_SECRET: ${{ secrets.UPM_SERVICE_ACCOUNT_KEY_SECRET }}
      UPM_ORG_ID: ${{ secrets.UPM_ORG_ID }}
      STAGING_DIR: ${{ runner.temp }}/package
      DIST_DIR: ${{ runner.temp }}/dist

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check the tag matches package.json
        run: |
          package_name="$(jq -r '.name' package.json)"
          package_version="$(jq -r '.version' package.json)"
          echo "PACKAGE_NAME=$package_name" >> "$GITHUB_ENV"
          echo "PACKAGE_VERSION=$package_version" >> "$GITHUB_ENV"

          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$package_version" != "$GITHUB_REF_NAME" ]; then
            printf 'Tag %s does not match package.json version %s\n' "$GITHUB_REF_NAME" "$package_version" >&2
            exit 1
          fi

      - name: Stage the package
        # The package lives at the repository root, leave the repository and CI files out of the tarball
        run: |
          mkdir -p "$STAGING_DIR"
          rsync -a --exclude '.git' --exclude '.github' --exclude '.gitignore' ./ "$STAGING_DIR/"

      - name: Install Unity UPM CLI
        run: |
          curl -fsSL https://cdn.packages.unity.com/upm-cli/install.sh -o install.sh
          bash install.sh
          echo "$HOME/.upm/bin" >> "$GITHUB_PATH"

      - name: Pack and sign
        run: |
          mkdir -p "$DIST_DIR"
          upm pack "$STAGING_DIR" --organization-id "$UPM_ORG_ID" --destination "$DIST_DIR"

      - name: Verify the signed package
        run: |
          shopt -s nullglob
          archives=("$DIST_DIR"/*.tgz "$DIST_DIR"/*.tar.gz)
          if [ "${#archives[@]}" -ne 1 ]; then
            printf 'Expected exactly one signed package archive, found %s\n' "${#archives[@]}" >&2
            exit 1
          fi

          archive="${archives[0]}"
          tar -tzf "$archive" | grep -qx 'package/package.json'
          tar -tzf "$archive" | grep -qx 'package/.attestation.p7m'
          tar -xOzf "$archive" package/package.json | jq -e --arg name "$PACKAGE_NAME" --arg version "$PACKAGE_VERSION" \
            '.name == $name and .version == $version'

          echo "PACKAGE_ARCHIVE=$archive" >> "$GITHUB_ENV"
          printf 'Signed archive: %s\n' "$(basename "$archive")"
          tar -tzf "$archive" | head -50

      - name: Keep the dry run tarball
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: signed-package
          path: ${{ env.PACKAGE_ARCHIVE }}
          retention-days: 7

      - name: Create GitHub Release
        if: github.event_name == 'push' && github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.PACKAGE_ARCHIVE }}

      - name: Publish on OpenUPM
        if: github.event_name == 'push' && github.ref_type == 'tag'
        uses: openupm/openupm-action@v1
        with:
          package: nl.jessestam.no-util
          tag: ${{ github.ref_name }}
