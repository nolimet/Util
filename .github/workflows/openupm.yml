name: OpenUPM

# Asks OpenUPM to scan the repository for a version tag and waits until that version is installable from the registry.
# OpenUPM only accepts the request from a run on the tag itself (the OIDC token's ref must be the tag), so this runs on
# every pushed version tag. To retry a tag by hand use Actions > OpenUPM > Run workflow and pick the tag as the ref,
# that only works for tags whose commit contains this workflow.
on:
  push:
    tags:
      - '*.*.*'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: openupm/openupm-action@v1
        with:
          package: nl.jessestam.no-util
          tag: ${{ github.ref_name }}
